<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Over Crest Rally</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #ffcc00; --accent2: #29d3ff; --hot: #ff3b3b; --ink: #f2f6fa; --dim: #9fb3c8;
      --glass: rgba(10, 14, 22, 0.62); --glass2: rgba(255, 255, 255, 0.06); --line: rgba(255, 255, 255, 0.14);
      --cond: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
      --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html, body { margin: 0; height: 100%; background: #05070b; overflow: hidden; color: var(--ink); font-family: var(--sans); -webkit-user-select: none; user-select: none; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { pointer-events: none; }
    #ui { position: absolute; inset: 0; pointer-events: none; }
    #ui > * { pointer-events: auto; }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: max(16px, 4vh) max(16px, 5vw); box-sizing: border-box; opacity: 0; transform: translateX(30px); transition: opacity .35s, transform .35s; pointer-events: none; }
    .screen.on { opacity: 1; transform: none; pointer-events: auto; }
    .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 70% 50%, transparent 30%, rgba(0,0,0,.55) 100%), linear-gradient(90deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,.25) 45%, transparent 70%); }
    .logo { font-family: var(--cond); font-style: italic; font-weight: 900; line-height: .82; letter-spacing: -.01em; text-transform: uppercase; }
    .logo .a { display: block; font-size: clamp(54px, 11vw, 150px); background: linear-gradient(180deg, #fff 0%, #dfe7ef 55%, #9fb3c8 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 22px rgba(0,0,0,.6)); }
    .logo .b { display: inline-block; margin-top: .25em; font-size: clamp(18px, 2.6vw, 34px); letter-spacing: .32em; color: #111; background: var(--accent); padding: .12em .6em .12em .5em; transform: skewX(-14deg); }
    .logo .b span { display: inline-block; transform: skewX(14deg); }
    .sweep { position: relative; overflow: hidden; }
    .sweep::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); animation: sweep 3.2s ease-in-out infinite; }
    @keyframes sweep { 0%, 55% { left: -60%; } 100% { left: 130%; } }
    .press { margin-top: 6vh; font-family: var(--cond); font-weight: 700; font-size: clamp(16px, 2vw, 24px); letter-spacing: .3em; color: var(--ink); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
    .menu { display: flex; flex-direction: column; gap: 10px; margin-top: 4vh; width: min(460px, 92vw); }
    .btn { position: relative; font-family: var(--cond); font-style: italic; font-weight: 800; font-size: clamp(20px, 2.6vw, 30px); letter-spacing: .04em; text-transform: uppercase; color: var(--ink); background: linear-gradient(90deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border: 0; border-left: 4px solid transparent; padding: 10px 22px 8px; text-align: left; cursor: pointer; transform: skewX(-10deg); transition: background .15s, color .15s, transform .15s, border-color .15s; }
    .btn > span { display: inline-block; transform: skewX(10deg); }
    .btn small { display: block; font-family: var(--sans); font-style: normal; font-weight: 500; font-size: 12px; letter-spacing: .02em; text-transform: none; color: var(--dim); margin-top: 2px; }
    .btn.sel, .btn:hover { background: linear-gradient(90deg, var(--accent), #ffb000 70%, rgba(255,176,0,.0)); color: #0b0d10; border-left-color: #fff; transform: skewX(-10deg) translateX(10px); }
    .btn.sel small, .btn:hover small { color: #2a2410; }
    .btn:disabled { opacity: .35; }
    .hdr { font-family: var(--cond); font-style: italic; font-weight: 900; font-size: clamp(30px, 5vw, 60px); text-transform: uppercase; line-height: 1; display: flex; align-items: baseline; gap: 14px; }
    .hdr .tag { font-size: .38em; color: #0b0d10; background: var(--accent); padding: 2px 10px; transform: skewX(-12deg); font-weight: 800; letter-spacing: .12em; }
    .hint { position: absolute; left: max(16px, 5vw); bottom: max(14px, 3vh); font-family: var(--cond); font-weight: 600; letter-spacing: .12em; color: var(--dim); font-size: 15px; text-transform: uppercase; }
    .hint b { color: var(--ink); background: rgba(255,255,255,.12); padding: 1px 7px; border-radius: 3px; margin: 0 4px; }
    .glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid var(--line); border-radius: 4px; }
    .carinfo { position: absolute; left: max(16px, 5vw); bottom: max(60px, 10vh); width: min(420px, 90vw); padding: 18px 20px; }
    .carinfo h2 { margin: 0; font-family: var(--cond); font-style: italic; font-weight: 900; font-size: clamp(30px, 4vw, 48px); text-transform: uppercase; line-height: 1; }
    .carinfo .cls { font-family: var(--cond); font-weight: 700; letter-spacing: .2em; color: var(--accent); font-size: 15px; text-transform: uppercase; }
    .carinfo p { color: #c9d4df; font-size: 14px; line-height: 1.45; margin: 10px 0 14px; }
    .stat { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 10px; margin: 6px 0; font-family: var(--cond); font-weight: 700; letter-spacing: .12em; font-size: 14px; color: var(--dim); text-transform: uppercase; }
    .bar { height: 8px; background: rgba(255,255,255,.1); transform: skewX(-20deg); overflow: hidden; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .4s; }
    .arrows { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 max(8px, 3vw); pointer-events: none; }
    .arrows button { pointer-events: auto; font-family: var(--cond); font-size: 46px; font-weight: 900; color: var(--ink); background: rgba(0,0,0,.35); border: 1px solid var(--line); width: 56px; height: 72px; cursor: pointer; transform: skewX(-10deg); }
    .arrows button:hover { background: var(--accent); color: #111; }
    .stages { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr)); gap: 14px; margin-top: 3vh; overflow-y: auto; padding: 4px 4px 80px; max-height: calc(100vh - 160px); }
    .card { position: relative; cursor: pointer; padding: 16px 16px 14px; min-height: 140px; border: 1px solid var(--line); background-size: cover; overflow: hidden; transition: transform .15s, border-color .15s; }
    .card::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,.75)); }
    .card > * { position: relative; }
    .card.sel, .card:hover { transform: translateY(-4px) scale(1.02); border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), 0 12px 40px rgba(0,0,0,.5); }
    .card .rally { font-family: var(--cond); font-weight: 700; letter-spacing: .18em; font-size: 12px; color: var(--accent); text-transform: uppercase; }
    .card .name { font-family: var(--cond); font-style: italic; font-weight: 900; font-size: 28px; line-height: 1; text-transform: uppercase; margin: 4px 0 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-family: var(--cond); font-weight: 700; letter-spacing: .1em; font-size: 12px; text-transform: uppercase; padding: 2px 8px; background: rgba(0,0,0,.45); border: 1px solid var(--line); }
    .chip.best { color: var(--accent); border-color: rgba(255,204,0,.5); }
    .opts { margin-top: 3vh; width: min(640px, 92vw); display: flex; flex-direction: column; gap: 8px; }
    .opt { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: 10px 16px; font-family: var(--cond); font-weight: 700; font-size: 20px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; border-left: 4px solid transparent; background: rgba(255,255,255,.04); }
    .opt.sel, .opt:hover { background: rgba(255,204,0,.14); border-left-color: var(--accent); }
    .opt .val { color: var(--accent); font-style: italic; font-weight: 900; }
    .opt .val::before { content: "◀  "; color: var(--dim); font-style: normal; font-size: .7em; }
    .opt .val::after { content: "  ▶"; color: var(--dim); font-style: normal; font-size: .7em; }
    table.res { border-collapse: collapse; width: min(760px, 94vw); margin-top: 2.5vh; font-family: var(--cond); font-size: clamp(16px, 2vw, 21px); }
    table.res td { padding: 7px 12px; border-bottom: 1px solid rgba(255,255,255,.07); }
    table.res td.pos { font-weight: 900; font-style: italic; width: 40px; color: var(--dim); }
    table.res td.t { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
    table.res td.d { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; width: 90px; }
    table.res tr.me { background: linear-gradient(90deg, rgba(255,204,0,.28), rgba(255,204,0,.05)); }
    table.res tr.me td { color: #fff; }
    table.res tr.me td.pos { color: var(--accent); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 3vh; }
    .row .btn { font-size: clamp(18px, 2.2vw, 24px); }
    #loading { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(ellipse at center, #121a26, #05070b 70%); z-index: 5; }
    #loading.on { display: flex; }
    #loading .stage { font-family: var(--cond); font-style: italic; font-weight: 900; font-size: clamp(36px, 7vw, 86px); text-transform: uppercase; line-height: .9; text-align: center; }
    #loading .sub { font-family: var(--cond); letter-spacing: .3em; color: var(--accent); font-weight: 700; margin-top: 10px; text-transform: uppercase; text-align: center; }
    #loading .prog { width: min(420px, 80vw); height: 4px; background: rgba(255,255,255,.1); margin-top: 28px; overflow: hidden; transform: skewX(-20deg); }
    #loading .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); transition: width .25s; }
    #loading .tip { margin-top: 22px; color: var(--dim); font-size: 14px; max-width: 520px; text-align: center; line-height: 1.5; padding: 0 16px; }
    #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s; z-index: 4; }
    #touch { position: absolute; inset: 0; display: none; pointer-events: none; z-index: 3; }
    #touch.on { display: block; }
    #touch .z { position: absolute; bottom: 18px; width: 92px; height: 92px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.25); pointer-events: auto; display: flex; align-items: center; justify-content: center; font-family: var(--cond); font-weight: 800; color: rgba(255,255,255,.8); font-size: 18px; }
    #toast { position: absolute; right: 16px; top: 16px; font-family: var(--cond); font-weight: 700; letter-spacing: .1em; color: var(--dim); font-size: 13px; text-transform: uppercase; z-index: 6; pointer-events: none; }
    .keys { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 22px; margin-top: 3vh; font-family: var(--cond); font-size: 19px; align-items: center; width: min(720px, 94vw); }
    .keys .k { font-weight: 800; color: var(--accent); letter-spacing: .06em; }
    .keys .p { color: var(--dim); text-align: right; }
    @media (max-width: 640px) { .carinfo { bottom: 70px; } .hint { font-size: 12px; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui"></div>
  <div id="touch"></div>
  <div id="fade"></div>
  <div id="loading"><div class="stage" id="ld-stage">Loading</div><div class="sub" id="ld-sub"></div><div class="prog"><i id="ld-bar"></i></div><div class="tip" id="ld-tip"></div></div>
  <div id="toast"></div>
  <script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js" } }</script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
